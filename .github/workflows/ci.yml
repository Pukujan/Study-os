name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate research harness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Validate dependency lock
        run: python tools/check_dependency_lock.py

      - name: Install locked validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.lock

      - name: Compile Python utilities and tests
        run: python -m compileall tools tests

      - name: Validate schemas, manifest, privacy boundary, and session data
        run: python tools/validate_repo.py

      - name: Validate version and architecture boundaries
        run: python tools/check_engineering_baseline.py

      - name: Ruff lint
        run: python -m ruff check src tools tests cli

      - name: Pyright type check
        run: python -m pyright src/study_os

      - name: Build Study OS wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/study-os-wheel-smoke
          /tmp/study-os-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/study-os-wheel-smoke/bin/python tools/verify_built_package.py

      - name: Run tests with branch coverage gate
        run: |
          python -m coverage run --branch -m unittest discover -s tests -v
          python -m coverage report --fail-under=70

  python311:
    name: Python 3.11 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Validate dependency lock
        run: python tools/check_dependency_lock.py

      - name: Install locked validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.lock

      - name: Compile runtime and tests
        run: python -m compileall src tools tests

      - name: Build Study OS wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/study-os-wheel-smoke-311
          /tmp/study-os-wheel-smoke-311/bin/python -m pip install --no-deps dist/*.whl
          /tmp/study-os-wheel-smoke-311/bin/python tools/verify_built_package.py

      - name: Run full unittest and Hypothesis suite
        run: python -m unittest discover -s tests -v
