name: Install ACS hotloader on the task branch

on:
  push:
    branches:
      - task/SOS-0202-install-acs-hotloader
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.repository == 'Pukujan/Study-os' && github.ref == 'refs/heads/task/SOS-0202-install-acs-hotloader'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the task branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install jsonschema

      - name: Run certified ACS installer and its checks
        run: python tools/install_acs_hotloader.py

      - name: Commit the validated installation to the task branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No installation changes were produced."
            exit 1
          fi
          git commit -m "Install the certified ACS coordination and OIO surfaces"
          git push origin HEAD:task/SOS-0202-install-acs-hotloader
