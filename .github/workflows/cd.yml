name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: study-os-cd-gravebuster
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy gravebuster
    # Isolated Podman runner on gravebuster (labels: study-os-cd,linux,gravebuster,podman)
    runs-on: [self-hosted, study-os-cd, Linux, gravebuster, podman]
    timeout-minutes: 45
    steps:
      - name: Deploy SHA locally on gravebuster
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -eu
          sha="$DEPLOY_SHA"
          echo "Deploying $sha on gravebuster (in-pod runner)..."
          git config --global --add safe.directory /srv/study-os/app
          cd /srv/study-os/app
          git fetch --prune origin
          git checkout --force main
          git reset --hard "$sha"
          cd /srv/study-os
          cp -f app/deploy/docker-compose.yml docker-compose.yml
          docker compose up -d --build
          # Runner uses --network=host so 127.0.0.1 is gravebuster
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18400/api/health; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != 1 ]; then echo "local health failed"; exit 1; fi
          curl -fsS http://127.0.0.1:18400/api/health
          echo
          curl -fsS https://study.design-bakery.com/api/health
          echo
          echo "DEPLOYED=$(git -C /srv/study-os/app rev-parse HEAD)"