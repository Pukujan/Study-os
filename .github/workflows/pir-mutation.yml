name: PIR Mutation Gate

on:
  pull_request:
    paths:
      - "src/study_os/pir/**"
      - "src/study_os/services/pir_runtime.py"
      - "tests/test_pir_teaching_controller.py"
      - "tests/test_p4_pir_runtime_integration.py"
      - "pyproject.toml"
      - ".github/workflows/pir-mutation.yml"

permissions:
  contents: read

concurrency:
  group: pir-mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Kill critical PIR mutants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.lock

      - name: Install pinned mutation runner
        run: python -m pip install mutmut==3.7.0

      - name: Run targeted PIR mutation gate
        run: |
          rm -rf mutants .mutmut-cache
          mutmut run

      - name: Export mutation report
        if: always()
        run: mutmut junitxml > mutmut.xml || true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pir-mutmut-report
          path: mutmut.xml
          if-no-files-found: ignore
