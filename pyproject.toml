[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "study-os-local-runtime"
version = "0.1.0"
description = "Local-first Study OS semantic runtime"
requires-python = ">=3.11"
dependencies = [
    "fsrs>=6.3.2,<7",
    "pydantic>=2.13.4,<3",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.53,<1",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "argon2-cffi>=25.1,<26",
    "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
study_os = ["db/migrations/*.sql", "web/migrations/*.sql", "web/content/*.json", "web/player/lessons/*.v1.json", "web/player/prompts/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"src/study_os/__init__.py" = ["E402", "F401"]
"tests/test_p2_semantic_runtime_overrides.py" = ["E402"]

[tool.pyright]
include = ["src/study_os"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.coverage.run]
branch = true
source = ["src/study_os"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/study_os/pir/contracts.py",
    "src/study_os/pir/controller.py",
    "src/study_os/services/pir_runtime.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_pir_teaching_controller.py",
    "tests/test_p4_pir_runtime_integration.py",
    "tests/test_pir_critical_mutations.py",
    "tests/test_pir_mutation_authority.py",
    "tests/test_pir_mutation_semantics.py",
    "tests/test_pir_mutation_contract_edges.py",
]
also_copy = ["contracts/"]
use_setproctitle = false
max_stack_depth = -1
