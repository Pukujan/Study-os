[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "study-os-local-runtime"
version = "0.1.0"
description = "Local-first Study OS semantic runtime"
requires-python = ">=3.11"
dependencies = [
    "fsrs>=6.3.2,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
study_os = ["db/migrations/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pyright]
include = ["src/study_os"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.coverage.run]
branch = true
source = ["src/study_os"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
