manifest_version: "0.2.0"
project:
  name: Study OS
  repository: Pukujan/Study-os
  status: research-first
  phase: P2 adaptive-learning integration + engineering-verification hardening
  current_gate: R0
  mission: >-
    Convert AI-assisted study sessions into auditable evidence about where
    representation translation breaks, what intervention was attempted, and
    whether improvement survives assistance removal, transfer, and delay.
  current_scope:
    subjects:
      - subject-001
    domains:
      - dsa
    languages:
      - python
    concept_families:
      - sliding-window
      - running-extrema

research:
  primary_question: >-
    Can Study OS observe a representation-transition failure, change the
    representation or learning operation, and produce measurable improvement
    that survives fading, transfer, and delayed retrieval?
  evidence_classes:
    - observed
    - self_reported
    - derived
  required_outcomes:
    - immediate_behavior
    - assistance_removed
    - transfer
    - delayed_retention
  prohibited_claims:
    - fixed_learning_styles
    - subject_001_generalizes_to_population
    - self_report_equals_mastery
    - more_modalities_always_better
    - llm_inference_equals_observed_truth
    - synthetic_simulation_equals_human_learning_effect

canonical_paths:
  schemas: schemas/
  contracts: contracts/
  mcp_contract: contracts/study-os-mcp-tools.v0.1.json
  local_runtime_source: src/study_os/
  local_runtime_cli: cli/study_os.py
  local_runtime_migrations: src/study_os/db/migrations/
  adaptive: src/study_os/adaptive/
  curriculum_runtime: src/study_os/curriculum/
  domain: domains/dsa/
  sessions: sessions/
  subjects: subjects/
  datasets: datasets/
  checkpointing: docs/CHECKPOINTING.md
  learning_control_model: docs/LEARNING_CONTROL_MODEL.md
  learner_model_audit: docs/LEARNER_MODEL_CURRICULUM_AUDIT.md
  oss_donor_audit: docs/OSS_TUTORING_DONOR_AUDIT.md
  p2_integration_test_plan: docs/P2_COMPONENT_INTEGRATION_TEST_PLAN.md
  validation_strategy: docs/VALIDATION_STRATEGY.md
  handoff: docs/HANDOFF.md
  decisions: docs/DECISIONS.md

runtime:
  package_version: "0.1.0"
  topology: local_first
  initial_host: wsl
  live_state_in_github: false
  operational_database:
    engine: sqlite
    role: canonical_live_learner_state
    current_schema_version: 1
    migration_series: "0001"
    migrations_required: true
  private_evidence_store:
    default_root: ~/.study-os/evidence/
    raw_artifacts_immutable: true
    content_hashing_required: true
  app_surface:
    intended_name: "@StudyOS"
    protocol: mcp
    semantic_tools_only: true
    semantic_contract_version: "0.1.0"
    approved_tool_count: 13
    direct_localhost_from_chatgpt: false
    deployed_private_transport_configuration_in_public_repo: false
  checkpoint_source_of_truth_when_runtime_active: local_database
  github_checkpoint_role_when_runtime_active: optional_curated_or_reproducibility_export

privacy:
  repository_visibility: public
  raw_transcript_policy: local_or_private_by_default
  public_repo_may_contain:
    - hashes
    - manifests_without_private_content
    - redacted_fixtures
    - schemas
    - contracts
    - curated_derived_findings
    - public_safe_checkpoint_exports
  public_repo_must_not_contain:
    - full_private_chat_exports
    - secrets
    - account_identifiers
    - tunnel_credentials
    - hidden_eval_answers_exposed_to_tutor
    - hidden_engineering_holdout_answers_exposed_to_coding_agents

fossil:
  role: optional_export_and_promotion_layer
  runtime_dependency: false
  canonical_source_of_learning_events: study_os
  canonical_source_of_learner_checkpoints: study_os
  automatic_micro_event_ingest: false
  resume_dependency: false
  promotion_candidates:
    - curated_learning_trajectory
    - repeated_representation_finding
    - lesson_hypothesis
    - validated_domain_knowledge
    - research_conclusion

schemas:
  session_manifest: "0.1.0"
  learning_event: "0.1.0"
  learning_episode: "0.1.0"
  representation: "0.1.0"
  lesson_ir: "0.1.0"
  learner_checkpoint: "0.1.0"
  current_checkpoint: "0.1.0"
  competency_graph: "0.1.0"
  learner_snapshot: "0.1.0"
  decision_proposal: "0.1.0"
  attempt_telemetry: "0.1.0"

learning:
  execution_tracker: 10
  verification_tracker: 21
  active_research_scope:
    track: algorithmic_foundations
    domain: dsa
    language: python
  scoring_model: multidimensional_evidence_backed_capability_state
  global_mastery_scalar: false
  adaptive_authority: shadow
  promotion_ladder:
    - G0_source_license_assumption_audit
    - G1_adapter_conformance
    - G2_donor_reproduction
    - G3_replay
    - G4_live_shadow
    - G5_advisory_canary
    - G6_bounded_live_authority
    - G7_within_subject_outcome_comparison
  promotion_prerequisite: >-
    Relevant Issue #21 verification gates must pass before a component advances
    to G5 advisory/canary or later.
  implemented_foundations:
    - versioned_learner_snapshot_and_decision_proposal
    - structured_attempt_hint_representation_telemetry
    - atomic_running_extrema_curriculum_slice
    - baseline_and_bkt_diagnostic_selectors
    - cat_irt_shadow_selection
    - fsrs_retention_adapter
    - evidence_gated_scaffold_controller
    - contextual_representation_policy
    - learner_relative_complexity
    - tutor_behavior_regression
    - shadow_proposal_to_outcome_linkage
    - atomic_retention_probe_closure
    - richer_resume_projection
  remaining_pre_live_authority:
    - complete_live_shadow_comparisons
    - hidden_engineering_holdout
    - property_stateful_reference_model_verification
    - mutation_negative_controls
    - seeded_policy_simulation
    - advisory_canary_accept_reject_logging

engineering:
  architecture_style: modular_monolith
  verification_tracker: 21
  repository_checks_required: true
  github_actions:
    configured: true
    workflow: .github/workflows/ci.yml
    runtime_dependency: false
  current_ci_checks:
    - python_compile
    - repository_validation
    - unit_tests
  planned_pr_checks:
    - ruff_lint_format
    - pyright_typecheck
    - coverage
    - schema_contract_version_consistency
    - architecture_import_boundaries
    - focused_property_tests
    - relevant_hidden_acceptance
  planned_post_merge_checks:
    - broader_integration
    - replay
    - reference_model_differential
  planned_scheduled_checks:
    - large_property_stateful_runs
    - mutation_testing
    - fuzzing
    - seeded_100x_learner_policy_simulation
    - dependency_security_sweeps
  planned_release_checks:
    - hidden_holdout
    - backup_restore
    - performance
    - selected_chaos
    - project_state_doc_convergence
  formal_methods_policy:
    targeted_only: true
    candidates:
      - tla_plus_for_stateful_concurrency_protocols
      - alloy_for_relational_and_dag_invariants
      - smt_for_bounded_deterministic_constraints
      - theorem_provers_for_tiny_high_value_core_semantics_only
  modular_monolith_target_direction: >-
    domain/contracts -> curriculum + adaptive pure logic -> application/use-cases
    -> persistence/adapters -> MCP/HTTP/CLI
  refactor_guard: >-
    Do not aggressively decompose the preserved semantic runtime until property,
    state-machine, and reference-model verification freeze its behavior.
  agent_files:
    - AGENTS.md
    - PROJECT_MANIFEST.yaml
    - docs/HANDOFF.md
    - docs/DECISIONS.md

open_risks:
  - self_report_fluency_confused_with_learning
  - representation_overload
  - ai_solution_dependency
  - hallucinated_or_incorrect_instruction
  - evaluator_circularity
  - n_of_1_overgeneralization
  - transcript_privacy
  - agent_repository_drift
  - documentation_state_drift
  - hidden_holdout_leakage
  - verifier_overfitting
  - insufficient_test_oracle_independence
  - retry_duplicate_learning_events
  - partial_checkpoint_commit
  - local_runtime_backup_failure
  - insecure_remote_exposure_of_wsl_service
  - deployed_private_transport_drift_from_public_contract
  - adaptive_component_promoted_before_verification
  - synthetic_simulation_mistaken_for_human_learning_evidence

next_milestone: >-
  Establish the Issue #21 SWE/verification baseline (state/doc convergence,
  Ruff, Pyright, coverage, architecture/version checks, property/state-machine
  testing, reference-model differential testing, mutation/negative controls,
  hidden holdout design, and seeded learner-policy simulation), then resume
  Issue #10 live-shadow to G5 advisory/canary promotion work without changing
  private deployment secrets or granting unverified adaptive authority.
