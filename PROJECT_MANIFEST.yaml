manifest_version: "0.1.6"
project:
  name: Study OS
  repository: Pukujan/Study-os
  status: research-first
  phase: P1 secure ChatGPT-to-WSL MCP continuity
  current_gate: R0
  mission: >-
    Convert AI-assisted study sessions into auditable evidence about where
    representation translation breaks, what intervention was attempted, and
    whether improvement survives assistance removal, transfer, and delay.
  current_scope:
    subjects:
      - subject-001
    domains:
      - dsa
    languages:
      - python
    concept_families:
      - sliding-window

research:
  primary_question: >-
    Can Study OS observe a representation-transition failure, change the
    representation or learning operation, and produce measurable improvement
    that survives fading, transfer, and delayed retrieval?
  evidence_classes:
    - observed
    - self_reported
    - derived
  required_outcomes:
    - immediate_behavior
    - assistance_removed
    - transfer
    - delayed_retention
  prohibited_claims:
    - fixed_learning_styles
    - subject_001_generalizes_to_population
    - self_report_equals_mastery
    - more_modalities_always_better
    - llm_inference_equals_observed_truth

canonical_paths:
  schemas: schemas/
  contracts: contracts/
  mcp_contract: contracts/study-os-mcp-tools.v0.1.json
  local_runtime_source: src/study_os/
  local_runtime_cli: cli/study_os.py
  local_runtime_migrations: src/study_os/db/migrations/
  p1_secure_mcp: docs/P1_SECURE_MCP.md
  domain: domains/dsa/
  sessions: sessions/
  subjects: subjects/
  bootstrap_subject_checkpoint: subjects/subject-001/CURRENT.json
  datasets: datasets/
  plugins: plugins/
  fossil_exports: fossil/exports/
  checkpointing: docs/CHECKPOINTING.md
  local_runtime_architecture: docs/LOCAL_RUNTIME_ARCHITECTURE.md
  parallel_execution: docs/PARALLEL_EXECUTION_PLAN.md
  validation_strategy: docs/VALIDATION_STRATEGY.md
  luna_local_handoff: docs/LUNA_LOCAL_HANDOFF.md
  database_contract: docs/DATABASE_CONTRACT.md
  error_idempotency_contract: docs/ERROR_IDEMPOTENCY_CONTRACT.md
  research_foundations: docs/RESEARCH_FOUNDATIONS.md
  failure_modes: docs/FAILURE_MODES.md
  research_plan: docs/RESEARCH_PLAN.md
  measurement_model: docs/MEASUREMENT_MODEL.md
  build_gates: docs/BUILD_GATES.md
  source_index: docs/SOURCE_INDEX.md
  handoff: docs/HANDOFF.md
  decisions: docs/DECISIONS.md

runtime:
  topology: local_first
  initial_host: wsl
  live_state_in_github: false
  operational_database:
    engine: sqlite
    role: canonical_live_learner_state
    current_schema_version: 1
    migrations_required: true
    migration_target_if_needed: postgres
  private_evidence_store:
    default_root: ~/.study-os/evidence/
    raw_artifacts_immutable: true
    content_hashing_required: true
  app_surface:
    intended_name: "@StudyOS"
    protocol: mcp
    semantic_tools_only: true
    semantic_contract_version: "0.1.0"
    stdio_transport: available
    network_transport: streamable_http
    network_dependency: "mcp==2.0.0"
    local_network_endpoint: "http://127.0.0.1:8765/mcp"
    local_network_loopback_only: true
    bearer_token_env: STUDY_OS_MCP_BEARER_TOKEN
    bearer_required: true
    max_mcp_request_body_bytes: 1048576
    public_non_mcp_routes: false
    direct_localhost_from_chatgpt: false
    remote_access: openai_secure_mcp_tunnel
    public_quick_tunnel_allowed: false
    plan_workspace_capability_must_be_verified: true
  validation:
    local_runtime_validation_required: true
    health_doctor_required: true
    backup_restore_test_required: true
    idempotency_required_for_mutating_tools: true
    failure_injection_required: true
    p1_cross_client_resume_required: true
  checkpoint_source_of_truth_when_runtime_active: local_database
  github_checkpoint_role_when_runtime_active: optional_curated_or_reproducibility_export

privacy:
  repository_visibility: public
  raw_transcript_policy: local_or_private_by_default
  public_repo_may_contain:
    - hashes
    - manifests_without_private_content
    - redacted_fixtures
    - schemas
    - contracts
    - curated_derived_findings
    - public_safe_checkpoint_exports
  public_repo_must_not_contain:
    - full_private_chat_exports
    - secrets
    - account_identifiers
    - hidden_eval_answers_exposed_to_tutor
    - tunnel_credentials
    - bearer_tokens

fossil:
  role: optional_export_and_promotion_layer
  runtime_dependency: false
  canonical_source_of_learning_events: study_os
  canonical_source_of_learner_checkpoints: study_os
  automatic_micro_event_ingest: false
  resume_dependency: false
  promotion_candidates:
    - curated_learning_trajectory
    - repeated_representation_finding
    - lesson_hypothesis
    - validated_domain_knowledge
    - research_conclusion

schemas:
  session_manifest: "0.1.0"
  learning_event: "0.1.0"
  learning_episode: "0.1.0"
  representation: "0.1.0"
  lesson_ir: "0.1.0"
  learner_checkpoint: "0.1.0"
  current_checkpoint: "0.1.0"

learning:
  checkpoint_policy:
    canonical: derived_from_events_and_episodes
    immutable_snapshots: true
    mutable_current_pointer: true
    required_boundaries:
      - session_end
      - lesson_boundary
      - breakthrough
      - persistent_failure
      - pre_transfer
      - post_transfer
      - pre_delay
      - post_delay
  difficulty_ladder:
    L0: observe
    L1: predict
    L2: explain
    L3: reconstruct
    L4: semantic_pseudocode
    L5: scaffolded_code
    L6: blank_implementation
    L7: debug
    L8: recognize
    L9: transfer
    L10: derive_or_modify
  initial_representation_families:
    - textual
    - static_figure
    - mermaid_flowchart
    - deterministic_state_trace
    - invariant
    - semantic_pseudocode
    - python_scaffold
    - blank_python
  deferred_modalities:
    - generated_images
    - generated_video
    - production_audio_pipeline

engineering:
  parallel_execution_issue: 5
  architecture_issue: 4
  repository_checks_required: true
  p0_status: accepted_merged
  p0_merge_commit: 19735a507ccdf9b29451a66bbd65b4dbff7ff84d
  p0_target_wsl_tests_passed: 35
  p1_branch: codex/issue-5-p1-secure-mcp
  github_actions:
    configured: true
    workflow: .github/workflows/ci.yml
    runtime_dependency: false
    optional_during_R0: true
  local_runtime_validation_required: true
  cd_status: deferred_until_R0
  required_repository_checks:
    - python_compile
    - repository_validation
    - unit_tests
    - runtime_contract_tests
    - mcp_network_auth_tests
    - mcp_cross_client_resume_test
  p0_cloud_deliverables:
    - parallel_execution_plan
    - validation_strategy
    - luna_local_handoff
    - mcp_semantic_contract
    - database_contract
    - error_idempotency_contract
    - synthetic_reference_trajectory
    - runtime_contract_tests
  p0_local_required_validation:
    - empty_db_migration
    - migration_repeat_safety
    - foreign_keys
    - idempotent_writes
    - evidence_provenance_enforcement
    - raw_hash_mutation_detection
    - checkpoint_atomicity
    - resume_after_restart
    - doctor_detects_corruption
    - backup_restore_roundtrip
    - mcp_contract_conformance
    - prohibited_generic_tools_absent
  p1_required_acceptance:
    - secure_private_authenticated_chatgpt_to_wsl_path
    - exact_13_tool_discovery
    - chat_a_session_and_evidence_writes
    - chat_a_checkpoint
    - fresh_chat_b_resume_without_transcript_replay
    - exact_next_action_match
    - chat_b_subsequent_write_and_checkpoint
    - resume_after_service_restart
    - no_github_or_fossil_live_runtime_dependency
  agent_files:
    - AGENTS.md
    - PROJECT_MANIFEST.yaml
    - docs/HANDOFF.md
    - docs/DECISIONS.md
  assistant_skill_contracts:
    - plugins/study-os-ingest/skill.md
    - plugins/study-os-checkpoint/skill.md
  installed_study_os_chatgpt_plugin: false
  build_gate_requirements:
    - private_raw_evidence_hashed
    - normalized_transcript_with_provenance
    - failure_transition_identified
    - intervention_version_recorded
    - immediate_behavior_measured
    - assistance_removed
    - transfer_measured
    - delayed_retention_measured
    - self_report_compared_to_behavior
    - experiment_reconstructable_by_new_agent

open_risks:
  - self_report_fluency_confused_with_learning
  - representation_overload
  - ai_solution_dependency
  - hallucinated_or_incorrect_instruction
  - evaluator_circularity
  - n_of_1_overgeneralization
  - transcript_privacy
  - agent_repository_drift
  - research_overhead_burnout
  - scope_expansion_before_evidence_loop
  - cross_session_resume_without_checkpoint
  - checkpoint_drift_from_canonical_events
  - local_runtime_backup_failure
  - insecure_remote_exposure_of_wsl_service
  - chatgpt_plan_missing_required_mcp_write_actions
  - secure_tunnel_workspace_org_association_failure
  - local_cloud_contract_drift
  - retry_duplicate_learning_events
  - partial_checkpoint_commit

next_milestone: >-
  Validate the P1 loopback MCP network branch, establish an OpenAI Secure MCP
  Tunnel from the WSL tunnel client to 127.0.0.1:8765/mcp, register the private
  Study OS custom MCP app, and pass Chat A -> checkpoint -> fresh Chat B resume
  plus subsequent write and process-restart continuity without transcript replay.
